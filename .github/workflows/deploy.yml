name: CD (Deploy to Render)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run CI quickly (smoke) before deploy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and smoke test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import sys; print(' Smoke check passed (deps install).')"

      - name: Trigger Render Deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$HOOK"
